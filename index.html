<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Világjáró 🌍 MAX</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

:root{
--bg:#07111f;
--bg2:#0c1b2d;
--card:#10243a;
--text:#fff;
--muted:#b8c7d8;
--blue:#08aef5;
--blue2:#007ac2;
--gold:#ffc107;
}

body{
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
transition:.3s;
}

body.light{
--bg:#edf4f8;
--bg2:#dce8ef;
--card:#fff;
--text:#102030;
--muted:#526273;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
z-index:100;
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 6%;
background:rgba(4,12,22,.82);
backdrop-filter:blur(15px);
}

.logo{
font-size:23px;
font-weight:900;
}

.navlinks{
display:flex;
gap:22px;
align-items:center;
}

.navlinks a{
color:white;
text-decoration:none;
font-weight:bold;
}

.theme{
border:0;
width:43px;
height:43px;
border-radius:50%;
background:#ffffff20;
color:white;
font-size:20px;
cursor:pointer;
}

header{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:100px 20px 50px;
background:
linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.78)),
url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=85")
center/cover fixed;
}

.hero{
max-width:950px;
animation:appear 1s ease;
}

.hero h1{
font-size:clamp(48px,9vw,95px);
margin-bottom:18px;
text-shadow:0 5px 25px #000;
}

.hero p{
font-size:clamp(18px,3vw,27px);
margin-bottom:32px;
}

.button{
border:0;
display:inline-block;
padding:15px 27px;
border-radius:30px;
background:var(--blue);
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
text-decoration:none;
transition:.25s;
box-shadow:0 8px 25px #0005;
}

.button:hover{
transform:translateY(-4px) scale(1.04);
background:#20baff;
}

section{
padding:85px 6%;
}

.title{
font-size:40px;
text-align:center;
margin-bottom:12px;
}

.subtitle{
text-align:center;
color:var(--muted);
margin-bottom:35px;
font-size:17px;
}

.tools{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:35px;
}

.search{
width:min(600px,100%);
padding:16px 22px;
border:0;
border-radius:30px;
outline:none;
font-size:16px;
}

.places{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
gap:25px;
}

.card{
background:var(--card);
border-radius:22px;
overflow:hidden;
box-shadow:0 15px 40px #0005;
transition:.3s;
animation:appear .6s ease;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:210px;
object-fit:cover;
}

.content{
padding:22px;
}

.content h3{
font-size:24px;
margin-bottom:8px;
}

.location{
color:var(--muted);
margin-bottom:13px;
}

.content p{
color:var(--muted);
line-height:1.6;
margin-bottom:16px;
}

.stars{
color:var(--gold);
margin-bottom:16px;
}

.cardbuttons{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.small{
padding:11px 16px;
font-size:14px;
}

.favorite{
background:#ffffff18;
}

.favorite.active{
background:#e91e63;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-top:40px;
}

.stat{
background
